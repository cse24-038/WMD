<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Book Now | Gees Food Catering</title>
  <style>
    body {
      background: #1e1e1e;
      font-family: Arial, sans-serif;
      color: #eee;
      margin: 0;
      padding: 0;
      text-align: center;
    }

    h1 {
      color: #d4af37;
      margin: 20px 0;
    }

    form {
      background: #2b2b2b;
      max-width: 500px;
      margin: auto;
      padding: 20px;
      border-radius: 6px;
    }

    input, select, textarea, button {
      width: 100%;
      margin: 10px 0;
      padding: 10px;
      border: none;
      border-radius: 4px;
      background: #3a3a3a;
      color: #fff;
    }

    button {
      background: #d4af37;
      color: #000;
      cursor: pointer;
    }

    footer {
      margin-top: 20px;
      padding: 10px;
      background: #111;
      color: #ccc;
    }
  </style>
</head>
<body>

  <h1>Book Now</h1>

  <form>
    <input type="text" placeholder="Full Name" required />
    <input type="email" placeholder="Email" required />
    <input type="tel" placeholder="Phone" required />
    <select required>
      <option value="">Event Type</option>
      <option>Wedding</option>
      <option>Corporate</option>
      <option>Private Party</option>
      <option>Funeral</option>
    </select>
    <input type="date" required />
    <textarea placeholder="Message"></textarea>
    <button type="submit">Submit</button>
  </form>

  <footer>&copy; 2025 Gees Food Catering</footer>

</body>
</html>
