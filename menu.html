<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Menu | Gees Food Catering</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #1e1e1e;
      color: #eee;
    }

    header {
      background: #111;
      padding: 20px;
      text-align: center;
      border-bottom: 2px solid #d4af37;
    }

    h1 {
      color: #d4af37;
      text-align: center;
      margin-top: 30px;
    }

    section {
      max-width: 600px;
      margin: 20px auto;
      padding: 20px;
      background: #2b2b2b;
      border-radius: 8px;
    }

    h2 {
      color: #d4af37;
      margin-bottom: 10px;
    }

    ul {
      padding-left: 20px;
    }

    li {
      margin: 6px 0;
    }

    footer {
      text-align: center;
      padding: 15px;
      background: #111;
      color: #ccc;
      margin-top: 30px;
    }
  </style>
</head>
<body>

  <header>
    <h1>Gees Food Catering Menu</h1>
  </header>

  <section>
    <h2>Events</h2>
    <ul>
      <li>Grilled Chicken</li>
      <li>Beef Kebabs</li>
      <li>Veggie Wraps</li>
    </ul>
  </section>

  <section>
    <h2>Drinks</h2>
    <ul>
      <li>Lemonade</li>
      <li>Iced Tea</li>
      <li>Sparkling Water</li>
    </ul>
  </section>

  <section>
    <h2>Desserts</h2>
    <ul>
      <li>Cheesecake</li>
      <li>Brownies</li>
      <li>Fruit Cups</li>
    </ul>
  </section>

  <footer>
    &copy; 2025 Gees Food Catering
  </footer>

</body>
</html>
